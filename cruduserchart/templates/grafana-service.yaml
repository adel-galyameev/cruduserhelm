apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.grafana.name }}-service
  labels:
    {{- include "cruduserchart.labels" . | nindent 4 }}
spec:
  ports:
    - protocol: TCP
      targetPort: {{ .Values.grafana.containerPort }}
      port: {{ .Values.grafana.service.port }}
  selector:
    app: {{ .Values.grafana.name }}
