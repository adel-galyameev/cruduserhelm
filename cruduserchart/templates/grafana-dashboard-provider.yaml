apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.grafana.name }}-dashboard-provider
  labels:
    {{- include "cruduserchart.labels" . | nindent 4 }}
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: true
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
