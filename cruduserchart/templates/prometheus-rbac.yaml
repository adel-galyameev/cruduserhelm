apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.prometheus.name }}-sa
  labels:
    {{- include "cruduserchart.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.prometheus.name }}-node-reader
  labels:
    {{- include "cruduserchart.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.prometheus.name }}-node-reader
  labels:
    {{- include "cruduserchart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.prometheus.name }}-node-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.prometheus.name }}-sa
    namespace: {{ .Release.Namespace }}
