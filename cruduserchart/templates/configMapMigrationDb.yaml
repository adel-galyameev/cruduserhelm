apiVersion: v1
kind: ConfigMap
metadata:
  name: {{- include "cruduserchart.name" . | indent 2 }}-migation-db
  labels:
    {{- include "cruduserchart.labels" . | nindent 4 }}
data:
  init.sql: | 
    CREATE TABLE IF NOT EXISTS users (
    id UUID PRIMARY KEY,
    name VARCHAR(124) NOT NULL,
    age INT NOT NULL,
    connect_date TIMESTAMP WITH TIME ZONE, 
    disconnect_date TIMESTAMP WITH TIME ZONE, 
    created_date TIMESTAMP WITH TIME ZONE, 
    updated_date TIMESTAMP WITH TIME ZONE
    )